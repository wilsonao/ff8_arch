name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# The default token needs read access to check out the repository itself
# (`permissions: {}` strips that too and checkout fails with "Repository not
# found" on a private repo).
permissions:
  contents: read

env:
  # Archipelago releases we test against, pinned to their release tag commits
  # (never an unreleased dev commit):
  # - minimum: our declared minimum_ap_version (ff8/archipelago.json), so the
  #   world keeps working for players who haven't updated. Bump only when
  #   raising minimum_ap_version.
  # - latest: the current stable release, which most players run. It also
  #   builds the shipped apworld. Bump when a new release ships.
  # The job names say "minimum"/"latest", not version numbers, so the required
  # status checks on main survive a bump.
  AP_MINIMUM_REF: debe4cf035c7c15efe6fb95f72343af0d420c68c  # 0.6.7
  AP_LATEST_REF: 54803be064fc7e80c4628777ed0b46a9390f255f   # 0.6.8

jobs:
  test:
    name: World tests (AP ${{ matrix.ap }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ap: [minimum, latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ff8_arch
      - name: Checkout Archipelago
        uses: actions/checkout@v4
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ matrix.ap == 'minimum' && env.AP_MINIMUM_REF || env.AP_LATEST_REF }}
          path: Archipelago
      - uses: actions/setup-python@v5
        with:
          # Python 3.13 is our dev checkout's Python. AP pins
          # typing_extensions==4.15.0, which is unsatisfiable on 3.11 (a test
          # dep there needs >=4.16), an AP packaging quirk rather than FF8.
          python-version: '3.13'
      - name: Generate tracker pack (PopTracker zip + UT pages inside ff8/tracker)
        working-directory: ff8_arch
        run: |
          pip install pillow
          python tools/gen_tracker_pack.py
      - name: Install world into Archipelago
        run: cp -r ff8_arch/ff8 Archipelago/worlds/ff8
      - name: Install dependencies
        working-directory: Archipelago
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          # AP's own install flow: --yes --force also pulls setuptools<81
          # (pkg_resources, which setuptools 81+ on current runners removed) and
          # the world's requirements, non-interactively.
          python ModuleUpdate.py --yes --force
          # ...but --force can't downgrade typing_extensions from the 4.16.0 the
          # runners now ship to AP's pinned ==4.15.0, so force AP's exact base
          # pins (API-compatible here) or the strict import check EOFs.
          pip install -r requirements.txt --no-deps --force-reinstall
          python Launcher.py --update_settings
      - name: Run FF8 world tests
        working-directory: Archipelago
        run: pytest worlds/ff8/test -n auto
      - name: Run AP's general world tests, scoped to FF8
        # Core's per-world checks (ids, names, items, options, reachability,
        # manifest). AP_TEST_WORLDS (0.6.8+) skips every other world; older
        # releases would run all of them, so only the latest leg does this.
        if: matrix.ap == 'latest'
        working-directory: Archipelago
        env:
          AP_TEST_WORLDS: ff8
        run: pytest test/general -n auto

  build:
    name: Build apworld + tracker pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ff8_arch
      - name: Checkout Archipelago
        uses: actions/checkout@v4
        with:
          repository: ArchipelagoMW/Archipelago
          # Built on the latest release. The apworld container format (version 7)
          # is the same back to the minimum, so the one file loads on both.
          ref: ${{ env.AP_LATEST_REF }}
          path: Archipelago
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate tracker pack (PopTracker zip + UT pages inside ff8/tracker)
        working-directory: ff8_arch
        run: |
          pip install pillow
          python tools/gen_tracker_pack.py
      - name: Install world into Archipelago
        run: cp -r ff8_arch/ff8 Archipelago/worlds/ff8
      - name: Install dependencies
        working-directory: Archipelago
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          # See the test job for why these three lines are shaped this way.
          python ModuleUpdate.py --yes --force
          pip install -r requirements.txt --no-deps --force-reinstall
          python Launcher.py --update_settings
      - name: Build ff8.apworld
        working-directory: Archipelago
        # --skip_open_folder (0.6.8+): don't try to open the output folder on
        # the headless runner
        run: python Launcher.py "Build APWorlds" -- "Final Fantasy VIII" --skip_open_folder
      - name: Upload apworld
        uses: actions/upload-artifact@v4
        with:
          name: ff8-apworld
          path: Archipelago/build/apworlds/ff8.apworld
      - name: Upload tracker pack
        uses: actions/upload-artifact@v4
        with:
          name: ff8-ap-tracker
          path: ff8_arch/build/ff8_ap_tracker.zip
      - name: Upload Visual Tracker preset
        uses: actions/upload-artifact@v4
        with:
          name: ff8-visual-tracker
          path: ff8_arch/build/ff8_visual_tracker.zip

  # Pushing a tag `vX.Y.Z` (matching world_version in ff8/archipelago.json) publishes
  # a GitHub Release with ff8.apworld and ff8_ap_tracker.zip attached, so players have
  # a stable download link: https://github.com/wilsonao/ff8_arch/releases/latest
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches world_version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 -c "import json; print(json.load(open('ff8/archipelago.json'))['world_version'])")
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match world_version $ver in ff8/archipelago.json"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ff8-apworld
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ff8-ap-tracker
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ff8-visual-tracker
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          extra=""
          case "$GITHUB_REF_NAME" in *-*) extra="--prerelease";; esac
          cat > notes.md <<'NOTES'
          ## Install

          1. Archipelago **Launcher** → **Install APWorld** → pick `ff8.apworld` (or copy it into `custom_worlds/`), then restart the Launcher.
          2. Optional: drop `ff8_ap_tracker.zip` into PopTracker's `packs/` folder.
          3. Optional: `ff8_visual_tracker.zip` is a map preset for the [Archipelago Visual Tracker](https://github.com/Wakamu/Archipelago/releases/latest) — see **Visual Tracker** below.

          ### Visual Tracker

          `ff8_visual_tracker.zip` pins every FF8 check on clickable world / extras / GF-ability maps inside the Archipelago Visual Tracker client. To use it:

          1. Install [Universal Tracker](https://github.com/FarisTheAncient/Archipelago/releases?q=Tracker) (`tracker.apworld`) and [`visualtracker.apworld`](https://github.com/Wakamu/Archipelago/releases/latest) via **Launcher → Install APWorld**, then restart the Launcher.
          2. Copy `ff8_visual_tracker.zip` into the `visual_packs/` folder of your Archipelago install (create it next to `custom_worlds/` if missing). Do **not** unzip it.
          3. Launcher → **Visual Tracker**, connect to your server/slot; the FF8 preset is picked up automatically.

          Visual Tracker support grew out of a community map layout contributed by **caedesender** (Discord) — thank you!

          Requires Archipelago 0.6.7+ and *Final Fantasy VIII* Steam 2013 (`FF8_EN.exe`). Setup guide: the **Final Fantasy VIII** page on your WebHost, or the [Player Guide](https://github.com/wilsonao/ff8_arch/blob/main/docs/player-guide.md).
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/ff8.apworld dist/ff8_ap_tracker.zip dist/ff8_visual_tracker.zip             --title "FF8 Archipelago $GITHUB_REF_NAME" --notes-file notes.md --generate-notes $extra
      # The tracker zip is regenerated in CI, so its sha256 can't be known before the
      # tag. After publishing, write the released asset's hash into the top entry of
      # tracker/versions.json (PopTracker's update feed) and push that to main. The
      # entry itself (package_version, this tag's download_url, changelog) must
      # already be there - this step fails loudly if it isn't, leaving the release up
      # for a manual fix.
      # The push goes over SSH with a write deploy key (VERSIONS_SYNC_DEPLOY_KEY):
      # main's ruleset requires PRs + reviews, and deploy keys are the ruleset's
      # bypass actor for exactly this automated commit (GITHUB_TOKEN can't bypass).
      - name: Sync tracker/versions.json with the released zip
        env:
          DEPLOY_KEY: ${{ secrets.VERSIONS_SYNC_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/versions_sync_key
          chmod 600 ~/.ssh/versions_sync_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/versions_sync_key -o IdentitiesOnly=yes"
          git remote set-url origin git@github.com:wilsonao/ff8_arch.git
          git fetch origin main
          git checkout -B main origin/main
          sha=$(sha256sum dist/ff8_ap_tracker.zip | cut -c1-64)
          python3 - "$sha" "$GITHUB_REF_NAME" <<'PY'
          import json, pathlib, sys
          sha, tag = sys.argv[1], sys.argv[2]
          p = pathlib.Path("tracker/versions.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          top = d["versions"][0]
          want = f"https://github.com/wilsonao/ff8_arch/releases/download/{tag}/ff8_ap_tracker.zip"
          if top["download_url"] != want:
              raise SystemExit(f"::error::top versions.json entry points at {top['download_url']}, "
                               f"expected {want} - prepend an entry for this release")
          if top["sha256"] == sha:
              print("sha already up to date"); raise SystemExit(0)
          top["sha256"] = sha
          p.write_text(json.dumps(d, indent=4) + chr(10), encoding="utf-8")
          print(f"sha256 -> {sha}")
          PY
          if ! git diff --quiet tracker/versions.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tracker/versions.json
            git commit -m "Sync tracker/versions.json sha for $GITHUB_REF_NAME"
            git push origin main
          fi
